services:
  # 1. Ứng dụng chính (Nginx + Vue 3 Frontend + Laravel API + Reverb + Worker)
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
        VITE_REVERB_APP_KEY: "${REVERB_APP_KEY:-pnhau_core_reverb_key}"
        VITE_REVERB_HOST: "${DOMAIN:-localhost}"
        VITE_REVERB_PORT: "${APP_PORT:-8088}"
        VITE_REVERB_SCHEME: "${APP_SCHEME:-http}"
    image: equipment-manager:latest
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8088}:80"
    environment:
      APP_NAME: "Equipment Manager"
      APP_ENV: production
      APP_KEY: "${APP_KEY:-base64:XG8y8v7u8VzCdfk1z3V0Y9hL9tQ4b0OqUq+v5c7c2bM=}"
      APP_DEBUG: "false"
      APP_URL: "${APP_SCHEME:-http}://${DOMAIN:-localhost}:${APP_PORT:-8088}"
      
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-equipment_manager}"
      DB_USERNAME: "${DB_USERNAME:-equipment_user}"
      DB_PASSWORD: "${DB_PASSWORD:-equipment_secret}"
      
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: "${REVERB_APP_ID:-856214}"
      REVERB_APP_KEY: "${REVERB_APP_KEY:-pnhau_core_reverb_key}"
      REVERB_APP_SECRET: "${REVERB_APP_SECRET:-reverb_app_secret_production}"
      REVERB_HOST: "0.0.0.0"
      REVERB_PORT: 8090
      REVERB_SCHEME: "http"
      
      RUN_MIGRATIONS: "true"
    volumes:
      - app-storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 2. Cơ sở dữ liệu MySQL 8.0
  db:
    image: mysql:8.0
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-root_password_secret}"
      MYSQL_DATABASE: "${DB_DATABASE:-equipment_manager}"
      MYSQL_USER: "${DB_USERNAME:-equipment_user}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-equipment_secret}"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_password_secret}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 3. Cache & Queue Redis
  redis:
    image: redis:alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  app-storage:
  db-data:
  redis-data:
