# ==============================================================================
# Cấu hình Nginx Production cho Equipment Hub (Vue 3 + Laravel 11 + Reverb WebSocket)
# Vị trí đặt file trên server: /etc/nginx/sites-available/equipment_manager.conf
# Kích hoạt: sudo ln -s /etc/nginx/sites-available/equipment_manager.conf /etc/nginx/sites-enabled/
# ==============================================================================

# 1. Chuyển hướng toàn bộ HTTP sang HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com www.your-domain.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Server HTTPS chính
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name your-domain.com www.your-domain.com;

    # Đường dẫn thư mục mã nguồn trên server
    set $project_root /var/www/equipment_manager;

    # Chứng chỉ bảo mật SSL (Let's Encrypt sinh tự động qua Certbot)
    ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Giới hạn dung lượng tải file lên (15MB cho ảnh thiết bị)
    client_max_body_size 15M;

    # Log files
    access_log /var/log/nginx/equipment_manager_access.log;
    error_log /var/log/nginx/equipment_manager_error.log warn;

    # Bật nén Gzip tối ưu tốc độ tải trang (< 0.5s)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # --------------------------------------------------------------------------
    # A. Phục vụ Giao diện Người dùng Vue 3 (SPA)
    # --------------------------------------------------------------------------
    root $project_root/Frontend/dist;
    index index.html;

    # Hỗ trợ Vue Router HTML5 History Mode
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache tài nguyên tĩnh (Fonts, Icons, JS, CSS)
    location ~* \.(?:css|js|woff2?|eot|ttf|otf|svg|png|jpg|jpeg|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # --------------------------------------------------------------------------
    # B. Xử lý API Laravel Backend (/api/...)
    # --------------------------------------------------------------------------
    location /api {
        alias $project_root/Backend/public;
        try_files $uri $uri/ @laravel_api;

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $project_root/Backend/public/index.php;
            fastcgi_pass unix:/var/run/php/php8.3-fpm.sock; # Hoặc 127.0.0.1:9000
            fastcgi_index index.php;
            fastcgi_read_timeout 120s;
        }
    }

    location @laravel_api {
        rewrite /api/(.*)$ /api/index.php last;
    }

    # --------------------------------------------------------------------------
    # C. Truy cập Ảnh & Tệp đính kèm Media (/storage/...)
    # --------------------------------------------------------------------------
    location /storage/ {
        alias $project_root/Backend/storage/app/public/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # --------------------------------------------------------------------------
    # D. Proxy WebSocket Real-time Reverb (/app/...)
    # --------------------------------------------------------------------------
    location /app/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Chặn truy cập file ẩn và file cấu hình nhạy cảm (.env, .git)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
