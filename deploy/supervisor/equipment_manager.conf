# ==============================================================================
# Cấu hình Supervisor Quản lý Tiến trình chạy ngầm 24/7 cho Equipment Hub
# Vị trí đặt file trên server: /etc/supervisor/conf.d/equipment_manager.conf
# Nạp cấu hình: sudo supervisorctl reread && sudo supervisorctl update
# ==============================================================================

# 1. Quản lý WebSocket Server Laravel Reverb
[program:equipment-reverb]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/equipment_manager/Backend/artisan reverb:start --host=0.0.0.0 --port=8090
autostart=true
autorestart=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/equipment_reverb.log
stopwaitsecs=3600

# 2. Quản lý Hàng đợi (Queue Worker)
[program:equipment-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/equipment_manager/Backend/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/supervisor/equipment_worker.log
stopwaitsecs=3600

# 3. Quản lý Tác vụ định kỳ (Cronjob Scheduler)
[program:equipment-scheduler]
process_name=%(program_name)s
command=php /var/www/equipment_manager/Backend/artisan schedule:work
autostart=true
autorestart=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/equipment_scheduler.log
stopwaitsecs=3600
